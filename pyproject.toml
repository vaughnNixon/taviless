[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "taviless"
version = "0.1.1"
description = "Free, zero-dependency, open-source drop-in replacement for the Tavily Search API."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Taviless Contributors" }
]
keywords = [
    "search",
    "tavily",
    "ai",
    "agents",
    "langchain",
    "crewai",
    "rag",
    "searxng",
    "duckduckgo",
    "web-search"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Operating System :: OS Independent",
    "Typing :: Typed"
]
dependencies = []

[project.optional-dependencies]
extract = [
    "trafilatura>=1.6.0"
]
dev = [
    "pytest>=7.0.0",
    "trafilatura>=1.6.0"
]

[project.urls]
Homepage = "https://github.com/vaughnNixon/taviless"
Documentation = "https://github.com/vaughnNixon/taviless#readme"
Issues = "https://github.com/vaughnNixon/taviless/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["taviless*"]
exclude = ["tests*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
